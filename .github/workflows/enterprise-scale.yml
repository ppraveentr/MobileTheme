name: Enterprise Scale Branch

on:
  push:
    branches: [ "feature/enterprise-scale" ]

jobs:
  stable:
    name: Xcode 26.6 (stable)
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_26.6.app
    - name: Build and test (macOS)
      run: swift test 2>&1 | tail -n 200
    - name: Validate example themes
      run: |
        R=ExampleApp/ExampleApp/Resources
        swift run theme-cli validate $R/Theme.json
        swift run theme-cli validate --base $R/Theme.json $R/AccountTheme.json
    - name: Test (iOS simulator)
      run: |
        DEVICE=$(xcrun simctl list devices available iPhone | grep -m1 -oE 'iPhone[^(]*[^ (]')
        echo "Using simulator: $DEVICE"
        xcodebuild test -scheme MobileTheme -destination "platform=iOS Simulator,name=$DEVICE" 2>&1 | tail -n 100

  beta:
    name: Xcode 27 (beta)
    runs-on: xcode-27
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Xcode version
      run: xcodebuild -version
    - name: Build and test (macOS)
      run: swift test 2>&1 | tail -n 200
    - name: Test (iOS simulator)
      run: |
        DEVICE=$(xcrun simctl list devices available iPhone | grep -m1 -oE 'iPhone[^(]*[^ (]')
        echo "Using simulator: $DEVICE"
        xcodebuild test -scheme MobileTheme -destination "platform=iOS Simulator,name=$DEVICE" 2>&1 | tail -n 100
